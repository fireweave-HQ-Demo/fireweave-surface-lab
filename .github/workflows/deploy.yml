name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/fireweave-hq-demo/clinic-node:prod

jobs:
  deploy:
    if: github.repository == 'fireweave-HQ-Demo/clinic-assistent'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build console image
        run: docker build -f infra/docker/node.prod.Dockerfile -t "$IMAGE" .

      - name: Load image onto EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/ec2.pem"
          docker save "$IMAGE" | gzip -1 | ssh -i "$RUNNER_TEMP/ec2.pem" -o StrictHostKeyChecking=accept-new "${USER}@${HOST}" 'gunzip | docker load'

      - name: Restart prod
        uses: appleboy/ssh-action@v1.2.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          CLINIC_DATA_KEY: ${{ secrets.CLINIC_DATA_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          SEED_EMAIL: ${{ secrets.SEED_EMAIL }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
          OO_OTLP_ENDPOINT: ${{ secrets.OO_OTLP_ENDPOINT }}
          OO_QUERY_ENDPOINT: ${{ secrets.OO_QUERY_ENDPOINT }}
          OO_AUTHORIZATION: ${{ secrets.OO_AUTHORIZATION }}
          OO_STREAM: ${{ secrets.OO_STREAM }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 20s
          command_timeout: 180s
          envs: GH_TOKEN,PUBLIC_URL,POSTGRES_PASSWORD,MINIO_ROOT_USER,MINIO_ROOT_PASSWORD,CLINIC_DATA_KEY,BETTER_AUTH_SECRET,INTERNAL_TOKEN,SEED_EMAIL,SEED_PASSWORD,OO_OTLP_ENDPOINT,OO_QUERY_ENDPOINT,OO_AUTHORIZATION,OO_STREAM
          script: |
            set -euo pipefail
            APP_DIR="$HOME/clinic-assistent"
            ORIGIN="https://x-access-token:${GH_TOKEN}@github.com/fireweave-HQ-Demo/clinic-assistent.git"
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone --depth=1 --branch main "$ORIGIN" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git remote set-url origin "$ORIGIN"
            git fetch --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            git checkout -B main origin/main
            git reset --hard origin/main
            git remote set-url origin https://github.com/fireweave-HQ-Demo/clinic-assistent.git
            printf '%s\n' \
              "PUBLIC_URL=${PUBLIC_URL}" \
              "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
              "MINIO_ROOT_USER=${MINIO_ROOT_USER}" \
              "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}" \
              "CLINIC_DATA_KEY=${CLINIC_DATA_KEY}" \
              "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}" \
              "INTERNAL_TOKEN=${INTERNAL_TOKEN}" \
              "SEED_EMAIL=${SEED_EMAIL}" \
              "SEED_PASSWORD=${SEED_PASSWORD}" \
              "OO_OTLP_ENDPOINT=${OO_OTLP_ENDPOINT}" \
              "OO_QUERY_ENDPOINT=${OO_QUERY_ENDPOINT}" \
              "OO_AUTHORIZATION=${OO_AUTHORIZATION}" \
              "OO_STREAM=${OO_STREAM:-clinic}" \
              > .env
            chmod 600 .env
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh
