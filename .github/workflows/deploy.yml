name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          CLINIC_DATA_KEY: ${{ secrets.CLINIC_DATA_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          SEED_EMAIL: ${{ secrets.SEED_EMAIL }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 20m
          envs: PUBLIC_URL,POSTGRES_PASSWORD,MINIO_ROOT_USER,MINIO_ROOT_PASSWORD,CLINIC_DATA_KEY,BETTER_AUTH_SECRET,INTERNAL_TOKEN,SEED_EMAIL,SEED_PASSWORD
          script: |
            set -euo pipefail
            APP_DIR="$HOME/clinic-os"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --depth=1 --branch main https://github.com/fireweave-HQ-Demo/fireweave-test-repo.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git remote set-url origin https://github.com/fireweave-HQ-Demo/fireweave-test-repo.git
            git fetch --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            git checkout -B main origin/main
            git reset --hard origin/main
            printf '%s\n' \
              "PUBLIC_URL=${PUBLIC_URL}" \
              "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
              "MINIO_ROOT_USER=${MINIO_ROOT_USER}" \
              "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}" \
              "CLINIC_DATA_KEY=${CLINIC_DATA_KEY}" \
              "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}" \
              "INTERNAL_TOKEN=${INTERNAL_TOKEN}" \
              "SEED_EMAIL=${SEED_EMAIL}" \
              "SEED_PASSWORD=${SEED_PASSWORD}" \
              > .env
            chmod 600 .env
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh
