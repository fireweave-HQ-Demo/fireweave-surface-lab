name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          CLINIC_DATA_KEY: ${{ secrets.CLINIC_DATA_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          SEED_EMAIL: ${{ secrets.SEED_EMAIL }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 20s
          command_timeout: 50s
          envs: GH_TOKEN,PUBLIC_URL,POSTGRES_PASSWORD,MINIO_ROOT_USER,MINIO_ROOT_PASSWORD,CLINIC_DATA_KEY,BETTER_AUTH_SECRET,INTERNAL_TOKEN,SEED_EMAIL,SEED_PASSWORD
          script: |
            set -euo pipefail
            APP_DIR="$HOME/clinic-assistent"
            ORIGIN="https://x-access-token:${GH_TOKEN}@github.com/fireweave-HQ-Demo/clinic-assistent.git"
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone --depth=1 --branch main "$ORIGIN" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git remote set-url origin "$ORIGIN"
            git fetch --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            git checkout -B main origin/main
            git reset --hard origin/main
            git remote set-url origin https://github.com/fireweave-HQ-Demo/clinic-assistent.git
            printf '%s\n' \
              "PUBLIC_URL=${PUBLIC_URL}" \
              "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
              "MINIO_ROOT_USER=${MINIO_ROOT_USER}" \
              "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}" \
              "CLINIC_DATA_KEY=${CLINIC_DATA_KEY}" \
              "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}" \
              "INTERNAL_TOKEN=${INTERNAL_TOKEN}" \
              "SEED_EMAIL=${SEED_EMAIL}" \
              "SEED_PASSWORD=${SEED_PASSWORD}" \
              > .env
            chmod 600 .env
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh
