name: clinic

services:
  postgres:
    image: postgres:16
    profiles: [core, app, agents]
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pg:/var/lib/postgresql/data

  minio:
    image: bitnamilegacy/minio:latest
    profiles: [core, app, agents]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/bitnami/minio/data

  temporal:
    image: temporalio/auto-setup:1.27.2
    profiles: [core, app, agents]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: clinic
      POSTGRES_PWD: clinic
      POSTGRES_SEEDS: postgres
      POSTGRES_TLS_ENABLED: "false"
      POSTGRES_TLS_DISABLE_HOST_VERIFICATION: "true"
    ports:
      - "127.0.0.1:7233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    profiles: [core, app, agents]
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:13000
    ports:
      - "127.0.0.1:8080:8080"

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.15.0
    profiles: [core, app, agents]
    environment:
      ZO_ROOT_USER_EMAIL: admin@example.com
      ZO_ROOT_USER_PASSWORD: ChangeMe123!
      ZO_DATA_DIR: /data
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - oo:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    profiles: [core, app, agents]
    command: ["--config=/etc/otel/collector.yaml"]
    env_file:
      - ../.env
    environment:
      OO_OTLP_ENDPOINT: ${OO_OTLP_ENDPOINT:-http://openobserve:5080/api/default}
      OO_AUTHORIZATION: ${OO_AUTHORIZATION:-Basic YWRtaW5AZXhhbXBsZS5jb206Q2hhbmdlTWUxMjMh}
      OO_STREAM: ${OO_STREAM:-clinic}
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    depends_on: [openobserve]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  api:
    profiles: [app]
    image: clinic-node:local
    build:
      context: ..
      dockerfile: infra/docker/node.Dockerfile
    command: ["pnpm", "--filter", "@clinic/api", "exec", "tsx", "src/server.ts"]
    environment:
      DATABASE_URL: postgres://clinic_app:clinic_app@postgres:5432/clinic
      DATABASE_URL_ADMIN: postgres://clinic:clinic@postgres:5432/clinic
      CLINIC_DATA_KEY: dev-only-data-key
      TEMPORAL_ADDRESS: temporal:7233
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      BETTER_AUTH_SECRET: dev-better-auth-secret-32chars-min
      BETTER_AUTH_URL: http://localhost:13000
      INTERNAL_TOKEN: dev-internal-token
      BROWSER_RUNNER_URL: http://browser-runner:4020
      SANDBOX_EHR_URL: http://sandbox-ehr:4010
      SANDBOX_PAYER_URL: http://sandbox-payer:4011
      PORT: 4000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      temporal:
        condition: service_started

  worker:
    profiles: [app]
    image: clinic-node:local
    pull_policy: never
    command: ["pnpm", "--filter", "@clinic/api", "exec", "tsx", "src/worker.ts"]
    environment:
      DATABASE_URL: postgres://clinic_app:clinic_app@postgres:5432/clinic
      DATABASE_URL_ADMIN: postgres://clinic:clinic@postgres:5432/clinic
      CLINIC_DATA_KEY: dev-only-data-key
      TEMPORAL_ADDRESS: temporal:7233
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OUTREACH_WAIT_MS: 0
    depends_on:
      api:
        condition: service_started
      temporal:
        condition: service_started

  console:
    profiles: [app]
    image: clinic-node:local
    pull_policy: never
    command: ["pnpm", "--filter", "@clinic/console", "start"]
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:13000:3000"
    depends_on: [api]

  marketing:
    profiles: [app]
    image: clinic-node:local
    pull_policy: never
    command: ["pnpm", "--filter", "@clinic/marketing", "start"]
    ports:
      - "127.0.0.1:13001:3001"

  sandbox-ehr:
    profiles: [agents]
    image: clinic-sandbox:local
    build:
      context: ..
      dockerfile: infra/docker/sandbox.Dockerfile
    command: ["python", "/ehr.py"]
    ports:
      - "127.0.0.1:4010:4010"

  sandbox-payer:
    profiles: [agents]
    image: clinic-sandbox:local
    pull_policy: never
    command: ["python", "/payer.py"]
    ports:
      - "127.0.0.1:4011:4011"

  browser-runner:
    profiles: [agents]
    shm_size: "1gb"
    build:
      context: ..
      dockerfile: infra/docker/browser.Dockerfile
    environment:
      CLINIC_DATA_KEY: dev-only-data-key
      API_URL: http://api:4000
      INTERNAL_TOKEN: dev-internal-token
      PORT: 4020
    ports:
      - "127.0.0.1:4020:4020"
    depends_on: [sandbox-ehr, sandbox-payer, api]

  agent-worker:
    profiles: [agents]
    build:
      context: ..
      dockerfile: infra/docker/agent.Dockerfile
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      BROWSER_RUNNER_URL: http://browser-runner:4020
      FIXTURES_DIR: /fixtures/packets
    depends_on: [temporal, browser-runner]

  redis:
    image: redis:7
    profiles: [voice]
    ports:
      - "127.0.0.1:6379:6379"

  livekit:
    image: livekit/livekit-server:v1.8.4
    profiles: [voice]
    command: --dev --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "devkey: secret"
    ports:
      - "127.0.0.1:7880:7880"
    depends_on: [redis]

volumes:
  pg:
  minio:
  oo:
